# usecase.yaml — schema version 1
# AUTHORITATIVE manifest for langfuse-synth-ev. Owned by the portal contract (CTO).
# Commit this VERBATIM to the repo root of borismichel/langfuse-synth-ev.
# Validated against schemas/usecase.schema.json in langfuse-demo-portal.
schema_version: 1
slug: ev-subsidy-regression
name: "EV Subsidy Silent Regression"
tagline: "Investigate a disputed loan, score the policy, test the prompt and verify the production fix."
vertical: "Financial Services / Consumer Lending"
story: |
  A retrieved EV grant amendment is missing from the decision prompt's inputs,
  causing eligible applications to be rejected. Investigate with Halo, review
  and curate a regression dataset, and compare the binding repair in native
  Playground and Prompt Experiments. Promote the tested version, then verify
  a fresh Companion decision and its native policy score.

langfuse_features:
  - tracing
  - prompt-management
  - llm-as-judge
  - datasets
  - experiments
  - scores

assets:
  docs:
    - path: README.md
      title: "Overview"
    - path: langfuse-demo-synth-spec.md
      title: "Full spec"
    - path: VERIFICATION.md
      title: "Verification checks"
    - path: docs/native-prompt-experiments.md
      title: "Native experiment setup"
    - path: docs/policy-evaluation.md
      title: "Policy evaluation setup"
    - path: docs/live-policy-verification.md
      title: "Live policy verification"
  screenshots:
    - docs/evidence/359-native-ui/live-baseline-corrected.png

target:
  project_hint: "demo"
  supports: [cloud_eu, cloud_us, self_hosted]
  cloud_notes: "Free tier caps events. Run plan first and keep the trace estimate ≤80% of the tier cap; scale down with generation.target_traces."

llm:
  # Demo-time model calls (live playground submission + experiment task) route through the
  # Companion Adapter's shared provider layer (langfuse_synth_core.companion.llm, since the
  # Spec G · G4 shell-swap). First provider = deploy-time default. The portal injects the
  # selected provider's key via the LLM_API_KEY sentinel below, plus LLM_PROVIDER and (when
  # declared here) LLM_MODEL — the contract the adapter reads is unchanged.
  providers: [anthropic, openai]
  models:
    # Anthropic intentionally omitted: with no LLM_MODEL injected, the kit keeps its
    # built-in Anthropic model (claude-sonnet-4-6), so existing deployments are
    # byte-for-byte unaffected. OpenAI has no built-in default worth pinning here.
    openai: gpt-4o

base_config:
  # EV ships a single config; Cloud runs scale down via --set rather than a separate file.
  default: config/demo.yaml

config_schema:
  # v1 contract: each property NAME is a dotted kit-config key applied as `--set name=value`.
  type: object
  properties:
    generation.seed:
      type: integer
      default: 42
      minimum: 0
      title: "Generation seed"
      description: "Controls deterministic sampling and generated IDs. Reproducing a dataset also requires the same configuration and Data as of date. Re-seeding an existing project can add duplicate data; use a separate demo project."
    generation.target_traces:
      # The CANONICAL, cross-kit operator volume knob (Ring 2, #33). Replaces EV's bespoke
      # generation.total_traces operator knob (now internal only). Shape is exactly what
      # langfuse_synth_core.authoring.inject_target_traces(minimum=100, maximum=6000,
      # default=800) emits; EV's direct-count derivation hook maps it 1:1 to the internal
      # generation.total_traces at seed time (identity / direct count).
      type: integer
      minimum: 100
      maximum: 6000
      default: 800
      title: "Target traces"
      description: "Sets the target number of backdated traces. This value is not a cost estimate."
    generation.window_days:
      type: integer
      default: 30
      enum: [14, 30]
      title: "History window"
      description: "Number of calendar days ending on and including the Data as of date (UTC)."
    ambient_incidents.cost_spike.enabled:
      type: boolean
      default: true
      title: "Cost spike"
      description: "Adds planner generations to sampled traces during the configured cost-spike window. Low trace counts may produce no incident."
    ambient_incidents.error_burst.enabled:
      type: boolean
      default: true
      title: "Error burst"
      description: "Marks sampled subsidy-eligibility or affordability tool calls as errors during the configured error window. Low trace counts may produce no incident."
    ambient_incidents.latency_degrade.enabled:
      type: boolean
      default: false
      title: "Latency degradation"
      description: "Increases generated observation durations for traces during the configured latency window. Low trace counts may produce no matching traces."
  required: []

pipeline:
  - id: probe
    run: "synth probe --config {config}"
    when: "host_kind != self_hosted"
    fatal: true
  - id: plan
    run: "synth plan --config {config}"
    parse:
      # EV `plan` prints state.summary as JSON; total_traces is the headline count.
      event_count: 'regex:"total_traces":\s*(\d+)'
    gate: "confirm"
  - id: seed
    run: "synth seed --config {config}"
    resumable: "synth import-spool --config {config}"
    timeout_minutes: 90
  - id: verify
    run: "synth verify --config {config}"
    fatal: true

artifacts:
  - path: DEMO_SCRIPT.md
    render: markdown
    title: "Presenter Runbook"
  - path: SCHEDULE.json
    title: "Generated schedule"
  - path: NATIVE_EXPERIMENT_ITEMS.json
    title: "Native experiment and reserved curation inputs"
  - path: NATIVE_EXPERIMENTS.md
    render: markdown
    title: "Native experiment setup"

  - path: POLICY_EVALUATOR.py
    title: "Policy correctness code evaluator"
  - path: POLICY_EVALUATION.json
    title: "Evaluation definitions and reviewed examples"
  - path: POLICY_COVERAGE.py
    title: "Offline evaluation coverage reporter"
  - path: POLICY_EVALUATION.md
    render: markdown
    title: "Policy evaluation setup"
  - path: LIVE_POLICY_VERIFICATION.md
    render: markdown
    title: "Live policy verification"

live_components:
  - name: playground
    description: "Loan application form and lending analytics. Each submission uses the current production prompt."
    command: "synth playground --config {config} --host 0.0.0.0 --port 8080"
    port: 8080
    requires_secrets: [LANGFUSE_PUBLIC_KEY, LANGFUSE_SECRET_KEY, LLM_API_KEY]
    # One container serving the decision configurator (/) and the in-scene dashboard.
    routes:
      - path: /
        title: "Decision configurator"
      - path: /analytics
        title: "Lending analytics"
    default_ttl_hours: 168
    max_ttl_hours: 720
    health_path: "/"

teardown:
  note: |
    Langfuse ingestion is append-only; teardown is project-level. Delete the Langfuse
    project (or create a fresh one) and re-deploy. The portal only marks the deployment
    torn down and stops any live instances. Re-seeding the SAME project is not safe: OTLP
    appends rather than upserting, so the demo would be told twice. Import-spool refuses a
    second run rather than doubling the volume.

# Operator setup metadata. Presentation preserves the released Cloud operator
# defaults on every host; base-file volume is an internal generation value. The smaller rehearsal
# preserves the 24-item policy dataset, three curation examples and verifier.
setup:
  version: 1
  schedule:
    timezone: UTC
    end: inclusive
    history:
      field: generation.window_days
  fields:
    generation.target_traces: {group: volume}
    ambient_incidents.cost_spike.enabled: {group: scenario}
    ambient_incidents.error_burst.enabled: {group: scenario}
    ambient_incidents.latency_degrade.enabled: {group: scenario}
    generation.seed: {group: advanced}
  host_defaults:
    cloud_eu: {generation.target_traces: 800}
    cloud_us: {generation.target_traces: 800}
    self_hosted: {generation.target_traces: 800}
  presets:
    quick_rehearsal:
      label: Quick rehearsal
      values:
        generation.target_traces: 300
